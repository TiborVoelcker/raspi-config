# Stub for the device-specific base module.
#
# This is NOT fetched from GitHub - it stays local to each SD card
# (included via `file:///boot/firmware/modules/base.yaml`) because it
# carries the user account, password hash and SSH key for that specific
# Pi. Never commit a filled-in version of this file.
#
# The easiest way to get one: use the Raspberry Pi Imager's OS
# customization options (hostname, user, SSH key, locale, timezone) when
# writing the SD card, then copy its generated `user-data` here and rename
# it to `base.yaml` (see README). The placeholders below show roughly what
# that output looks like, in case you want to write it by hand instead.
#cloud-config
manage_resolv_conf: false
hostname: raspberrypi  # set hostname
manage_etc_hosts: true
packages:
- avahi-daemon
apt:
  preserve_sources_list: true
  conf: |
    Acquire {
      Check-Date "false";
    };
timezone: Europe/Berlin
keyboard:
  model: pc105  # standard 105-key PC keyboard
  layout: "de"
users:
- name: pi  # replace with your username
  gecos: Pi User
  groups: users,adm,dialout,audio,netdev,video,plugdev,cdrom,games,input,gpio,spi,i2c,render,sudo
  shell: /bin/bash
  lock_passwd: false
  passwd: "<PWD>" # created with `openssl passwd -6` or `mkpasswd -m sha-512`
  ssh_authorized_keys:
    - ssh-rsa <SSH_KEY> # add public SSH key here
  sudo: ALL=(ALL) NOPASSWD:ALL  # Don't require password for sudo
enable_ssh: true  # Enable ssh
ssh_pwauth: false  # Disables SSH password auth (`PasswordAuthentication no`)
rpi:
  # Enable RPi interfaces
  interfaces:
    serial: true
package_update: true  # Update packages on first boot (`apt update`)
package_upgrade: true  # Upgrade the instance on first boot (`apt upgrade`)
package_reboot_if_required: true  # Reboot after package installation
